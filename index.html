<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>简历管理系统</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
/* ========== DESIGN TOKENS ========== */
:root {
  --bg: #f5f5f7;
  --card: #ffffff;
  --card-hover: #fafafa;
  --text: #1d1d1f;
  --text-secondary: #86868b;
  --text-tertiary: #aeaeb2;
  --border: #e5e5ea;
  --border-light: #f2f2f7;
  --blue: #0071e3;
  --blue-light: #e8f2fd;
  --blue-dark: #005bbf;
  --green: #34c759;
  --green-light: #e8f8ed;
  --orange: #ff9500;
  --orange-light: #fff4e5;
  --red: #ff3b30;
  --red-light: #ffe5e5;
  --purple: #af52de;
  --purple-light: #f3e8fa;
  --teal: #5ac8fa;
  --teal-light: #e8f7fe;
  --shadow-sm: 0 1px 3px rgba(0,0,0,.06);
  --shadow-md: 0 4px 12px rgba(0,0,0,.08);
  --shadow-lg: 0 20px 60px rgba(0,0,0,.15);
  --radius-sm: 8px;
  --radius: 12px;
  --radius-lg: 20px;
  --radius-xl: 24px;
  --font: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "PingFang SC", "Helvetica Neue", sans-serif;
  --transition: cubic-bezier(0.25, 0.1, 0.25, 1);
  --spring: cubic-bezier(0.34, 1.56, 0.64, 1);
}

/* ========== RESET ========== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--font);
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow-x: hidden;
}

/* ========== HEADER ========== */
.header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: rgba(245,245,247,.72);
  backdrop-filter: saturate(180%) blur(20px);
  -webkit-backdrop-filter: saturate(180%) blur(20px);
  border-bottom: 1px solid var(--border);
  padding: 16px 24px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
}
.header-left h1 {
  font-size: 22px;
  font-weight: 700;
  letter-spacing: -.02em;
  color: var(--text);
}
.header-left .subtitle {
  font-size: 13px;
  color: var(--text-secondary);
  margin-top: 2px;
}
.header-right {
  display: flex;
  align-items: center;
  gap: 12px;
}

/* ========== STATS BAR ========== */
.stats-bar {
  display: flex;
  gap: 8px;
  padding: 16px 24px;
  overflow-x: auto;
  -webkit-overflow-scrolling: touch;
  scrollbar-width: none;
}
.stats-bar::-webkit-scrollbar { display: none; }
.stat-chip {
  flex: 0 0 auto;
  padding: 6px 14px;
  border-radius: 100px;
  font-size: 13px;
  font-weight: 500;
  cursor: pointer;
  border: 1px solid var(--border);
  background: var(--card);
  color: var(--text-secondary);
  transition: all .2s var(--transition);
  user-select: none;
  white-space: nowrap;
}
.stat-chip:hover { border-color: var(--blue); color: var(--blue); background: var(--blue-light); }
.stat-chip.active { background: var(--blue); color: #fff; border-color: var(--blue); }
.stat-chip .count { font-weight: 600; margin-left: 2px; }

/* ========== TOOLBAR ========== */
.toolbar {
  display: flex;
  gap: 8px;
  padding: 0 24px 16px;
  align-items: center;
  flex-wrap: wrap;
}
.search-box {
  flex: 1;
  min-width: 200px;
  position: relative;
}
.search-box input {
  width: 100%;
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  padding: 0 80px 0 36px;
  font-size: 15px;
  font-family: var(--font);
  color: var(--text);
  outline: none;
  transition: all .2s var(--transition);
}
.search-box input:focus { border-color: var(--blue); box-shadow: 0 0 0 3px rgba(0,113,227,.12); }
.search-box .search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-tertiary);
  font-size: 16px;
  pointer-events: none;
}
.filter-select {
  height: 40px;
  border-radius: 10px;
  border: 1px solid var(--border);
  background: var(--card);
  padding: 0 32px 0 12px;
  font-size: 14px;
  font-family: var(--font);
  color: var(--text);
  cursor: pointer;
  outline: none;
  appearance: none;
  background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%2386868b' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");
  background-repeat: no-repeat;
  background-position: right 10px center;
  transition: all .2s var(--transition);
}
.filter-select:focus { border-color: var(--blue); }

/* ========== RESUME GRID ========== */
.resume-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
  gap: 16px;
  padding: 0 24px 100px;
}

/* ========== RESUME CARD ========== */
.resume-card {
  background: var(--card);
  border-radius: var(--radius-lg);
  border: 1px solid var(--border);
  padding: 20px;
  cursor: pointer;
  transition: all .3s var(--transition);
  position: relative;
  overflow: hidden;
  animation: cardIn .4s var(--spring) backwards;
}
.resume-card:hover {
  transform: translateY(-2px);
  box-shadow: var(--shadow-md);
  border-color: transparent;
}
.resume-card:active { transform: scale(.98); }
.resume-card .card-header {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 12px;
}
.resume-card .name {
  font-size: 17px;
  font-weight: 600;
  letter-spacing: -.01em;
}
.resume-card .code {
  font-size: 11px;
  color: var(--text-tertiary);
  font-weight: 500;
  font-variant-numeric: tabular-nums;
}
.resume-card .card-body { display: flex; flex-direction: column; gap: 6px; margin-bottom: 14px; }
.resume-card .info-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 14px;
  color: var(--text-secondary);
}
.resume-card .info-row .dot { width: 4px; height: 4px; border-radius: 50%; background: var(--text-tertiary); flex-shrink: 0; }
.resume-card .card-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-bottom: 14px;
}
.tag {
  font-size: 11px;
  font-weight: 500;
  padding: 3px 10px;
  border-radius: 100px;
  background: var(--blue-light);
  color: var(--blue);
  white-space: nowrap;
}
.tag.green { background: var(--green-light); color: #1a7a3a; }
.tag.orange { background: var(--orange-light); color: #b06d00; }
.tag.purple { background: var(--purple-light); color: #7a2db5; }
.tag.teal { background: var(--teal-light); color: #0077a3; }
.tag.red { background: var(--red-light); color: #c41e1e; }
.resume-card .card-footer {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding-top: 12px;
  border-top: 1px solid var(--border-light);
}
.resume-card .status-badge {
  font-size: 12px;
  font-weight: 600;
  padding: 4px 10px;
  border-radius: 100px;
}
.status-badge.screening { background: var(--blue-light); color: var(--blue); }
.status-badge.interviewing { background: var(--orange-light); color: var(--orange); }
.status-badge.offered { background: var(--green-light); color: #1a7a3a; }
.status-badge.rejected { background: var(--red-light); color: var(--red); }
.resume-card .time {
  font-size: 12px;
  color: var(--text-tertiary);
}

/* ========== FAB ========== */
.fab {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--blue);
  color: #fff;
  border: none;
  cursor: pointer;
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  box-shadow: 0 4px 20px rgba(0,113,227,.4);
  transition: all .3s var(--spring);
  z-index: 90;
  line-height: 0;
}
.fab:hover {
  transform: scale(1.08);
  box-shadow: 0 8px 30px rgba(0,113,227,.5);
}
.fab:active { transform: scale(.94); }

/* ========== SHEET (BOTTOM MODAL) ========== */
.sheet-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.3);
  z-index: 1000;
  opacity: 0;
  pointer-events: none;
  transition: opacity .3s var(--transition);
  backdrop-filter: blur(4px);
  -webkit-backdrop-filter: blur(4px);
}
.sheet-overlay.open { opacity: 1; pointer-events: auto; }
.sheet {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  max-height: 90vh;
  background: var(--card);
  border-radius: var(--radius-xl) var(--radius-xl) 0 0;
  z-index: 1001;
  transform: translateY(100%);
  transition: transform .4s var(--spring);
  display: flex;
  flex-direction: column;
  box-shadow: var(--shadow-lg);
}
.sheet.open { transform: translateY(0); }
.sheet-handle {
  width: 36px;
  height: 5px;
  background: #d2d2d7;
  border-radius: 100px;
  margin: 12px auto 0;
  flex-shrink: 0;
}
.sheet-header {
  padding: 20px 24px 16px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid var(--border-light);
  flex-shrink: 0;
}
.sheet-header h2 {
  font-size: 20px;
  font-weight: 700;
  letter-spacing: -.02em;
}
.sheet-close {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: none;
  background: var(--bg);
  cursor: pointer;
  font-size: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  color: var(--text-secondary);
  transition: all .2s var(--transition);
}
.sheet-close:hover { background: #e5e5ea; color: var(--text); }
.sheet-body { flex: 1; overflow-y: auto; padding: 20px 24px; -webkit-overflow-scrolling: touch; }

/* ========== FORM ELEMENTS ========== */
.form-group { margin-bottom: 20px; }
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 6px;
  text-transform: uppercase;
  letter-spacing: .04em;
}
.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 14px;
  border: 1px solid var(--border);
  border-radius: 10px;
  font-size: 15px;
  font-family: var(--font);
  color: var(--text);
  background: var(--bg);
  outline: none;
  transition: all .2s var(--transition);
  resize: vertical;
}
.form-group input:focus,
.form-group textarea:focus,
.form-group select:focus {
  border-color: var(--blue);
  box-shadow: 0 0 0 3px rgba(0,113,227,.1);
}
.form-group textarea { min-height: 100px; }
.form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.form-row.three { grid-template-columns: repeat(3, 1fr); }

/* ========== UPLOAD ZONE ========== */
.upload-zone {
  border: 2px dashed var(--border);
  border-radius: var(--radius-lg);
  padding: 40px;
  text-align: center;
  cursor: pointer;
  transition: all .2s var(--transition);
  background: var(--bg);
}
.upload-zone:hover, .upload-zone.drag-over {
  border-color: var(--blue);
  background: var(--blue-light);
}
.upload-zone .upload-icon {
  font-size: 40px;
  margin-bottom: 12px;
}
.upload-zone p { font-size: 15px; color: var(--text-secondary); }
.upload-zone .hint { font-size: 13px; color: var(--text-tertiary); margin-top: 4px; }
.upload-zone input[type="file"] { display: none; }

/* ========== EXTRACTION PREVIEW ========== */
.extraction-preview {
  background: var(--blue-light);
  border-radius: var(--radius);
  padding: 16px;
  margin-top: 16px;
}
.extraction-preview h3 {
  font-size: 14px;
  font-weight: 600;
  color: var(--blue);
  margin-bottom: 12px;
}
.extraction-preview .preview-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  font-size: 13px;
}
.extraction-preview .preview-item {
  display: flex;
  gap: 6px;
}
.extraction-preview .preview-key {
  color: var(--text-secondary);
  flex-shrink: 0;
}
.extraction-preview .preview-val { color: var(--text); font-weight: 500; }

/* ========== BUTTONS ========== */
.btn {
  height: 40px;
  padding: 0 20px;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 500;
  font-family: var(--font);
  cursor: pointer;
  border: none;
  transition: all .2s var(--transition);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  white-space: nowrap;
}
.btn-primary { background: var(--blue); color: #fff; }
.btn-primary:hover { background: var(--blue-dark); }
.btn-primary:active { transform: scale(.97); }
.btn-secondary { background: var(--bg); color: var(--text); border: 1px solid var(--border); }
.btn-secondary:hover { background: #e5e5ea; }
.btn-danger { background: var(--red); color: #fff; }
.btn-danger:hover { opacity: .9; }
.btn-ghost { background: transparent; color: var(--blue); }
.btn-ghost:hover { background: var(--blue-light); }
.btn-sm { height: 32px; padding: 0 14px; font-size: 13px; border-radius: 8px; }
.btn:disabled { opacity: .5; pointer-events: none; }

/* ========== EMPTY STATE ========== */
.empty-state {
  text-align: center;
  padding: 80px 24px;
  animation: fadeIn .6s var(--transition);
}
.empty-state .empty-icon { font-size: 56px; margin-bottom: 16px; }
.empty-state h3 { font-size: 20px; font-weight: 600; margin-bottom: 8px; }
.empty-state p { color: var(--text-secondary); font-size: 15px; max-width: 300px; margin: 0 auto 24px; }

/* ========== LOADING SKELETON ========== */
.skeleton {
  background: linear-gradient(90deg, #f0f0f0 25%, #e0e0e0 50%, #f0f0f0 75%);
  background-size: 200% 100%;
  animation: shimmer 1.5s infinite;
  border-radius: 8px;
}
.skeleton-card {
  height: 180px;
  border-radius: var(--radius-lg);
}
@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

/* ========== TOAST ========== */
.toast-container {
  position: fixed;
  top: 20px;
  right: 20px;
  z-index: 2000;
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.toast {
  background: var(--card);
  border-radius: var(--radius);
  padding: 14px 20px;
  box-shadow: var(--shadow-md);
  font-size: 14px;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 10px;
  animation: toastIn .35s var(--spring);
  border: 1px solid var(--border);
  max-width: 380px;
}
.toast.success { border-left: 3px solid var(--green); }
.toast.error { border-left: 3px solid var(--red); }
.toast.info { border-left: 3px solid var(--blue); }
.toast.removing { animation: toastOut .2s var(--transition) forwards; }

@keyframes toastIn {
  from { opacity: 0; transform: translateX(40px); }
  to { opacity: 1; transform: translateX(0); }
}
@keyframes toastOut {
  to { opacity: 0; transform: translateX(40px); }
}

/* ========== DETAIL SHEET ========== */
.detail-hero {
  display: flex;
  gap: 20px;
  align-items: flex-start;
  margin-bottom: 24px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--border-light);
}
.detail-hero-photo {
  flex-shrink: 0;
  width: 80px;
  height: 80px;
  border-radius: 50%;
  overflow: hidden;
  background: var(--bg);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 40px;
}
.detail-hero-photo img {
  width: 100%;
  height: 100%;
  object-fit: cover;
}
.detail-hero-info {
  flex: 1;
  min-width: 0;
}
.detail-hero-info .hero-name {
  font-size: 24px;
  font-weight: 700;
  letter-spacing: -.02em;
  margin-bottom: 4px;
}
.detail-hero-info .hero-code {
  font-size: 12px;
  color: var(--text-tertiary);
  font-variant-numeric: tabular-nums;
  margin-bottom: 10px;
}
.detail-hero-info .hero-meta {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  align-items: center;
}
.detail-section-card {
  background: var(--bg);
  border-radius: var(--radius);
  padding: 16px;
  margin-bottom: 12px;
  transition: all .2s var(--transition);
}
.detail-section-card:hover {
  background: #eeeef2;
}
.detail-section-card .section-title {
  font-size: 11px;
  font-weight: 700;
  color: var(--text-tertiary);
  text-transform: uppercase;
  letter-spacing: .06em;
  margin-bottom: 12px;
  display: flex;
  align-items: center;
  gap: 6px;
}
.detail-section-card .section-title .section-icon {
  font-size: 14px;
}
.detail-info-row {
  display: flex;
  align-items: baseline;
  gap: 8px;
  padding: 5px 0;
  font-size: 14px;
}
.detail-info-row .info-key {
  font-size: 13px;
  color: var(--text-secondary);
  flex-shrink: 0;
  min-width: 56px;
}
.detail-info-row .info-val {
  color: var(--text);
  font-weight: 500;
  word-break: break-all;
}
.detail-info-row .info-val a {
  color: var(--blue);
  text-decoration: none;
}
.detail-info-row .info-val a:hover {
  text-decoration: underline;
}
.detail-tags-row {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 4px;
}
.detail-text-block {
  font-size: 13px;
  color: var(--text-secondary);
  line-height: 1.6;
  white-space: pre-wrap;
  max-height: 200px;
  overflow-y: auto;
  background: var(--card);
  border-radius: 8px;
  padding: 12px;
  border: 1px solid var(--border-light);
}
.detail-section {
  border-top: 1px solid var(--border-light);
  padding-top: 16px;
  margin-top: 8px;
}
.detail-section h4 {
  font-size: 13px;
  font-weight: 600;
  color: var(--text-secondary);
  margin-bottom: 12px;
}

/* ========== ACTION BAR ========== */
.action-bar {
  display: flex;
  gap: 8px;
  padding-top: 16px;
  border-top: 1px solid var(--border-light);
  margin-top: 8px;
}

/* ========== CONFIRM DIALOG ========== */
.confirm-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.4);
  z-index: 3000;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .2s var(--transition);
}
.confirm-overlay.open { opacity: 1; pointer-events: auto; }
.confirm-dialog {
  background: var(--card);
  border-radius: var(--radius-lg);
  padding: 24px;
  max-width: 360px;
  width: 90%;
  text-align: center;
  box-shadow: var(--shadow-lg);
  transform: scale(.9);
  transition: transform .3s var(--spring);
}
.confirm-overlay.open .confirm-dialog { transform: scale(1); }
.confirm-dialog h3 { font-size: 17px; margin-bottom: 8px; }
.confirm-dialog p { font-size: 14px; color: var(--text-secondary); margin-bottom: 20px; }
.confirm-dialog .confirm-actions { display: flex; gap: 8px; justify-content: center; }

/* ========== ANIMATIONS ========== */
@keyframes cardIn {
  from { opacity: 0; transform: translateY(16px); }
  to { opacity: 1; transform: translateY(0); }
}
@keyframes fadeIn {
  from { opacity: 0; }
  to { opacity: 1; }
}

/* ========== RESPONSIVE ========== */
@media (max-width: 768px) {
  .resume-grid { grid-template-columns: 1fr; padding: 0 16px 100px; }
  .header { padding: 14px 16px; }
  .stats-bar { padding: 12px 16px; }
  .toolbar { padding: 0 16px 12px; }
  .form-row { grid-template-columns: 1fr; }
  .form-row.three { grid-template-columns: 1fr; }
  .detail-grid { grid-template-columns: 1fr; }
  .fab { bottom: 24px; right: 24px; width: 50px; height: 50px; font-size: 24px; }
}

/* ========== SCROLLBAR ========== */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border); border-radius: 100px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-tertiary); }
</style>
</head>
<body>

<!-- HEADER -->
<div class="header">
  <div class="header-left">
    <h1>📄 lesue的简历库</h1>
    <div class="subtitle" id="headerCount">加载中…</div>
  </div>
  <div class="header-right">
    <span id="syncStatus" style="font-size:11px;color:var(--text-tertiary);cursor:help;" title="数据同步状态"></span>
    <button class="btn btn-ghost btn-sm" onclick="syncNow()" title="强制同步">🔄 同步</button>
    <button class="btn btn-ghost btn-sm" onclick="importJSON()" title="导入">📥 导入</button>
    <button class="btn btn-ghost btn-sm" onclick="exportJSON()" title="导出">📤 导出</button>
  </div>
</div>

<!-- STATS BAR -->

<script>
// ========== CONFIG ==========
const SUPABASE_URL = 'https://kihibtxvuimmrsrybpsf.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_9qlKQCwzEMUR-d5ZPMHTmQ_S3dAeETd';
const DEEPSEEK_API_KEY = 'REMOVED_KEY';
const DEEPSEEK_API_URL = 'https://api.deepseek.com/chat/completions';
const STORAGE_KEY = 'resume_system_data';
const SYNC_KEY = 'resume_system_last_sync';

// ========== SUPABASE ==========
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let supabaseOnline = false;

// ========== STATE ==========
let resumes = [];
let activeStatusFilter = '';
let confirmCallback = null;
let currentFile = null;
let currentPDFImage = null; // base64 of first page render

// ========== HELPERS ==========
function generateCode() {
  const now = new Date();
  const date = now.toISOString().slice(0,10).replace(/-/g,'');
  const seq = String(Date.now() % 100000).padStart(5,'0');
  return `CV-${date}-${seq}`;
}

function timeAgo(dateStr) {
  if (!dateStr) return '';
  const diff = Date.now() - new Date(dateStr).getTime();
  const mins = Math.floor(diff / 60000);
  if (mins < 1) return '刚刚';
  if (mins < 60) return `${mins}分钟前`;
  const hours = Math.floor(mins / 60);
  if (hours < 24) return `${hours}小时前`;
  const days = Math.floor(hours / 24);
  if (days < 30) return `${days}天前`;
  return new Date(dateStr).toLocaleDateString('zh-CN');
}

function statusLabel(s) {
  const map = { screening:'筛选中', interviewing:'面试中', offered:'已 Offer', rejected:'已拒绝' };
  return map[s] || s;
}

function toast(msg, type='info') {
  const container = document.getElementById('toastContainer');
  const t = document.createElement('div');
  t.className = `toast ${type}`;
  const icons = { success:'✅', error:'❌', info:'ℹ️' };
  t.innerHTML = `${icons[type]||'ℹ️'} ${msg}`;
  container.appendChild(t);
  setTimeout(() => {
    t.classList.add('removing');
    setTimeout(() => t.remove(), 200);
  }, 2500);
}

// ========== DATA LAYER ==========
function loadLocal() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    return raw ? JSON.parse(raw) : [];
  } catch { return []; }
}

function saveLocal(data) {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(data));
}

async function loadSupabase() {
  const { data, error } = await sb.from('resumes').select('*').order('created_at', { ascending: false });
  if (error) throw error;
  return data || [];
}

async function checkSupabase() {
  try {
    const { error } = await sb.from('resumes').select('id', { count: 'exact', head: true });
    supabaseOnline = !error;
    return supabaseOnline;
  } catch {
    supabaseOnline = false;
    return false;
  }
}

async function loadResumes() {
  // Always load local first (fast, always works)
  const local = loadLocal();

  // Try Supabase sync in background
  if (await checkSupabase()) {
    try {
      const remote = await loadSupabase();
      if (remote.length > 0) {
        // Merge: remote wins for same unique_code, new local ones also kept
        const merged = mergeResumes(local, remote);
        resumes = merged;
        saveLocal(merged);
        localStorage.setItem(SYNC_KEY, Date.now());
      } else {
        // Remote empty, push local to remote
        resumes = local;
        if (local.length > 0) await pushAllToSupabase(local);
      }
    } catch (e) {
      console.warn('Supabase sync failed, using local:', e.message);
      resumes = local;
      supabaseOnline = false;
    }
  } else {
    resumes = local;
  }

  renderAll();
  updateSyncIndicator();
}

function mergeResumes(local, remote) {
  const map = new Map();
  // Local first (lower priority)
  local.forEach(r => map.set(r.unique_code, r));
  // Remote overwrites (higher priority — has server timestamps)
  remote.forEach(r => map.set(r.unique_code, r));
  return Array.from(map.values()).sort((a, b) =>
    new Date(b.created_at).getTime() - new Date(a.created_at).getTime()
  );
}

async function pushAllToSupabase(data) {
  // Push in batches of 50
  for (let i = 0; i < data.length; i += 50) {
    const batch = data.slice(i, i + 50).map(r => {
      const { id, ...rest } = r; // Remove local id, let Supabase generate
      return rest;
    });
    await sb.from('resumes').upsert(batch, { onConflict: 'unique_code' });
  }
}

function updateSyncIndicator() {
  const el = document.getElementById('syncStatus');
  if (!el) return;
  const lastSync = localStorage.getItem(SYNC_KEY);
  if (supabaseOnline) {
    el.innerHTML = '🟢 已同步';
    el.title = lastSync ? `上次同步: ${new Date(parseInt(lastSync)).toLocaleString('zh-CN')}` : '';
  } else {
    el.innerHTML = '🔴 仅本地';
    el.title = 'Supabase 不可用，数据仅保存在本机';
  }
}

// ========== CRUD ==========
async function doSave(data) {
  const record = {
    id: Date.now().toString(), // local unique id
    unique_code: generateCode(),
    name: data.name || null,
    gender: data.gender || null,
    age: data.age || null,
    birth_year: data.birth_year || null,
    birth_date: data.birth_date || null,
    phone: data.phone || null,
    email: data.email || null,
    city: data.city || null,
    school: data.school || null,
    degree: data.degree || null,
    major: data.major || null,
    graduation_year: data.graduation_year || null,
    current_company: data.current_company || null,
    current_position: data.current_position || null,
    work_years: data.work_years || null,
    employment_status: data.employment_status || null,
    current_salary: data.current_salary || null,
    expected_salary: data.expected_salary || null,
    skills: data.skills || [],
    tech_direction: data.tech_direction || null,
    github: data.github || null,
    papers_link: data.papers_link || null,
    has_top_papers: data.has_top_papers || false,
    source: data.source || null,
    target_position: data.target_position || null,
    interview_status: 'screening',
    hr_notes: data.hr_notes || null,
    resume_text: data.resume_text || null,
    photo: data.photo || currentPDFImage || null,
    created_at: new Date().toISOString(),
    updated_at: new Date().toISOString(),
  };

  // Save locally
  resumes.unshift(record);
  saveLocal(resumes);

  // Try Supabase
  if (supabaseOnline) {
    try {
      const { error } = await sb.from('resumes').insert(record);
      if (error) console.warn('Supabase save failed:', error.message);
    } catch (e) { console.warn('Supabase save error:', e.message); }
  }

  toast('简历已保存 ✅', 'success');
  closeSheet();
  renderAll();
}

// Remove old doSave if duplicated below — let me check the file
// (the old doSave was replaced, now it's only one version above)

async function updateStatus(id, status) {
  const r = resumes.find(r => r.id == id || r.unique_code == id);
  if (!r) return;
  r.interview_status = status;
  r.updated_at = new Date().toISOString();
  saveLocal(resumes);

  if (supabaseOnline) {
    try {
      await sb.from('resumes').update({ interview_status: status, updated_at: r.updated_at }).eq('id', id);
    } catch (e) { /* ignore */ }
  }

  renderAll();
  toast(`状态已更新为 ${statusLabel(status)}`, 'success');
}

async function deleteResume(id) {
  const idx = resumes.findIndex(r => r.id == id || r.unique_code == id);
  if (idx > -1) {
    resumes.splice(idx, 1);
    saveLocal(resumes);
  }

  if (supabaseOnline) {
    try {
      await sb.from('resumes').delete().eq('id', id);
    } catch (e) { /* ignore */ }
  }

  toast('已删除', 'info');
  closeConfirm();
  closeDetail();
  renderAll();
}

function confirmDelete(id) {
  const r = resumes.find(r => r.id == id || r.unique_code == id);
  if (!r) return;
  document.getElementById('confirmTitle').textContent = '确认删除';
  document.getElementById('confirmMsg').textContent = `确定要删除「${r.name || '未命名'}」的简历吗？此操作不可撤销。`;
  document.getElementById('confirmOverlay').classList.add('open');
  confirmCallback = () => deleteResume(id);
}

function closeConfirm() {
  document.getElementById('confirmOverlay').classList.remove('open');
  confirmCallback = null;
}

function executeConfirm() {
  if (confirmCallback) confirmCallback();
}

// ========== RENDER ==========
function renderAll() {
  renderStats();
  renderResumes();
  document.getElementById('headerCount').textContent = `共 ${resumes.length} 份简历`;
}

function renderStats() {
  const total = resumes.length;
  const counts = {};
  resumes.forEach(r => {
    const s = r.interview_status || 'screening';
    counts[s] = (counts[s] || 0) + 1;
  });
  const chips = [
    { key: '', label: '全部', count: total },
    { key: 'screening', label: '筛选中', count: counts.screening || 0 },
    { key: 'interviewing', label: '面试中', count: counts.interviewing || 0 },
    { key: 'offered', label: '已 Offer', count: counts.offered || 0 },
    { key: 'rejected', label: '已拒绝', count: counts.rejected || 0 },
  ];
  document.getElementById('statsBar').innerHTML = chips.map(c =>
    `<div class="stat-chip${activeStatusFilter === c.key ? ' active' : ''}" onclick="filterByStatus('${c.key}')">${c.label}<span class="count"> ${c.count}</span></div>`
  ).join('');
}

function filterByStatus(key) {
  activeStatusFilter = activeStatusFilter === key ? '' : key;
  renderAll();
}

// ========== AI SEARCH ==========
let aiFilters = null; // Parsed AI filter state

function handleSearchInput() {
  const val = document.getElementById('searchInput').value.trim();
  if (!val) {
    aiFilters = null;
    document.getElementById('aiFilterTags').style.display = 'none';
    renderResumes();
  }
  // Live type only clears, AI search triggers on Enter or button click
  if (!val && !aiFilters) renderResumes();
}

async function aiSearch() {
  const query = document.getElementById('searchInput').value.trim();
  if (!query) return toast('请输入搜索内容', 'info');

  const btn = document.getElementById('aiSearchBtn');
  btn.disabled = true;
  btn.textContent = '⏳…';

  try {
    const now = new Date();
    const today = now.toISOString().slice(0, 10);
    const yesterday = new Date(now - 86400000).toISOString().slice(0, 10);
    const threeDaysAgo = new Date(now - 3 * 86400000).toISOString().slice(0, 10);
    const weekAgo = new Date(now - 7 * 86400000).toISOString().slice(0, 10);

    const prompt = `你是一个搜索解析助手。用户用自然语言搜索简历库，请解析为结构化筛选条件。返回严格JSON。

当前日期: ${today}
昨天: ${yesterday}
三天前: ${threeDaysAgo}
七天前: ${weekAgo}

简历库中每条记录有以下字段：
name(姓名), gender(性别), age(年龄), phone, email, city, school(学校), degree(学历:博士/硕士/本科/大专),
major(专业), graduation_year, current_company(公司), current_position(职位), work_years(年限),
employment_status(在职状态:在职/离职), current_salary, expected_salary, skills(技能标签数组),
tech_direction(技术方向:大模型预训练/大模型微调/大模型推理/Agent/多模态/CV/NLP/语音/推荐/其他),
has_top_papers(有顶会论文), interview_status(面试状态:screening筛选中/interviewing面试中/offered已Offer/rejected已拒绝),
hr_notes(备注), source(来源), target_position, created_at(导入时间:ISO格式)

用户搜索: "${query}"

请解析为JSON筛选条件。所有字段可选，不需要的设为null:
{
  "keywords": ["关键词数组，用于模糊匹配姓名/公司/学校/职位/技能"],
  "degree": "博士|硕士|本科|大专|null（如果提到985/211则返回985/211）",
  "school_tier": "985|211|null（985/211院校筛选）",
  "gender": "男|女|null",
  "employment_status": "在职|离职|null",
  "tech_direction": "从上方枚举中选|null",
  "interview_status": "screening|interviewing|offered|rejected|null",
  "has_top_papers": true|false|null,
  "created_after": "ISO日期（如"最近三天"=${threeDaysAgo},"昨天"=${yesterday},"上周"=${weekAgo}）|null",
  "created_before": "ISO日期|null",
  "min_work_years": 数字|null,
  "company": "公司名片段|null"
}

时间词映射："今天"=${today}, "昨天"=${yesterday}, "三天"/"最近三天"=${threeDaysAgo}, "一周"/"最近一周"=${weekAgo},"上周"=${weekAgo}
如果提到"985"则school_tier="985"，提到"211"则school_tier="211"
只返回JSON。`;

    const response = await fetch(DEEPSEEK_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', 'Authorization': `Bearer ${DEEPSEEK_API_KEY}` },
      body: JSON.stringify({ model: 'deepseek-chat', messages: [{ role: 'user', content: prompt }], temperature: 0.1, max_tokens: 600 }),
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || 'API错误');
    const content = data.choices?.[0]?.message?.content || '';
    const jsonMatch = content.match(/\{[\s\S]*\}/);
    if (!jsonMatch) throw new Error('解析失败');
    aiFilters = JSON.parse(jsonMatch[0]);

    // Show applied filter tags
    showAIFilterTags(aiFilters);
    renderResumes();
    toast('AI 搜索完成 ✅', 'success');
  } catch (e) {
    console.error('AI search error:', e);
    toast('AI 搜索失败: ' + e.message, 'error');
    aiFilters = null;
  } finally {
    btn.disabled = false;
    btn.textContent = '🤖 AI搜索';
  }
}

function showAIFilterTags(f) {
  const tags = [];
  if (f.keywords?.length) tags.push(`关键词: ${f.keywords.join('、')}`);
  if (f.degree) tags.push(`学历: ${f.degree}`);
  if (f.school_tier) tags.push(`${f.school_tier}院校`);
  if (f.gender) tags.push(f.gender);
  if (f.employment_status) tags.push(f.employment_status);
  if (f.tech_direction) tags.push(f.tech_direction);
  if (f.interview_status) tags.push({screening:'筛选中',interviewing:'面试中',offered:'已Offer',rejected:'已拒绝'}[f.interview_status]||f.interview_status);
  if (f.has_top_papers) tags.push('有顶会论文');
  if (f.created_after) tags.push(`${f.created_after} 之后`);
  if (f.company) tags.push(`公司: ${f.company}`);
  if (f.min_work_years) tags.push(`≥${f.min_work_years}年经验`);

  const el = document.getElementById('aiFilterTags');
  if (tags.length) {
    el.style.display = '';
    el.innerHTML = `<span style="color:var(--blue);">🧠 AI筛选: ${tags.join(' · ')}</span> <button onclick="clearAISearch()" style="background:none;border:none;color:var(--red);cursor:pointer;font-size:11px;">✕ 清除</button>`;
  } else {
    el.style.display = 'none';
  }
}

function clearAISearch() {
  aiFilters = null;
  document.getElementById('searchInput').value = '';
  document.getElementById('aiFilterTags').style.display = 'none';
  renderResumes();
}

function renderResumes() {
  const grid = document.getElementById('resumeGrid');
  const empty = document.getElementById('emptyState');
  const skeleton = document.getElementById('loadingSkeleton');

  if (skeleton) skeleton.style.display = 'none';

  const search = (!aiFilters) ? (document.getElementById('searchInput')?.value || '').toLowerCase() : '';
  const filterDegree = document.getElementById('filterDegree')?.value || '';
  const filterDirection = document.getElementById('filterDirection')?.value || '';
  const filterGender = document.getElementById('filterGender')?.value || '';
  const filterEmployment = document.getElementById('filterEmployment')?.value || '';

  let filtered = resumes.filter(r => {
    if (activeStatusFilter && r.interview_status !== activeStatusFilter) return false;
    if (filterDegree && r.degree !== filterDegree) return false;
    if (filterDirection && r.tech_direction !== filterDirection) return false;
    if (filterGender && r.gender !== filterGender) return false;
    if (filterEmployment && r.employment_status !== filterEmployment) return false;

    // AI filters
    if (aiFilters) {
      if (aiFilters.degree && r.degree !== aiFilters.degree) return false;
      if (aiFilters.school_tier && !isSchoolTier(r.school, aiFilters.school_tier)) return false;
      if (aiFilters.gender && r.gender !== aiFilters.gender) return false;
      if (aiFilters.employment_status && r.employment_status !== aiFilters.employment_status) return false;
      if (aiFilters.tech_direction && r.tech_direction !== aiFilters.tech_direction) return false;
      if (aiFilters.interview_status && r.interview_status !== aiFilters.interview_status) return false;
      if (aiFilters.has_top_papers === true && !r.has_top_papers) return false;
      if (aiFilters.company && !(r.current_company || '').toLowerCase().includes(aiFilters.company.toLowerCase())) return false;
      if (aiFilters.min_work_years && !r.work_years) return false;
      if (aiFilters.min_work_years && r.work_years && parseInt(r.work_years) < aiFilters.min_work_years) return false;
      if (aiFilters.created_after && r.created_at < aiFilters.created_after) return false;
      if (aiFilters.created_before && r.created_at > aiFilters.created_before) return false;
      if (aiFilters.keywords?.length) {
        const haystack = [r.name, r.current_company, r.current_position, r.school, r.target_position, ...(r.skills||[])].join(' ').toLowerCase();
        if (!aiFilters.keywords.some(kw => haystack.includes(kw.toLowerCase()))) return false;
      }
    }
    if (search) {
      const haystack = [r.name, r.current_company, r.current_position, r.school, r.target_position, ...(r.skills||[])].join(' ').toLowerCase();
      if (!haystack.includes(search)) return false;
    }
    return true;
  });

  if (filtered.length === 0) {
    grid.innerHTML = '';
    empty.style.display = '';
    return;
  }
  empty.style.display = 'none';

  grid.innerHTML = filtered.map((r, i) => {
    const skills = (r.skills || []).slice(0, 4);
    const tags = [];
    if (r.tech_direction) tags.push(`<span class="tag purple">${r.tech_direction}</span>`);
    if (r.degree) tags.push(`<span class="tag teal">${r.degree}</span>`);
    skills.forEach(s => tags.push(`<span class="tag">${s}</span>`));
    if (r.has_top_papers) tags.push(`<span class="tag orange">🏆 顶会</span>`);

    const infoParts = [];
    if (r.school) infoParts.push(r.school);
    if (r.current_company) infoParts.push(r.current_company);
    if (r.work_years) infoParts.push(`${r.work_years}年经验`);
    const infoStr = infoParts.join(' · ') || '暂无信息';

    return `
    <div class="resume-card" style="animation-delay:${i*0.04}s" onclick="openDetail('${r.id}')">
      <div style="display:flex;gap:14px;">
        <div style="flex:1;min-width:0;">
          <div class="card-header">
            <div class="name">${r.name || '未命名'}</div>
            <div class="code">${r.unique_code}</div>
          </div>
          <div class="card-body">
            <div class="info-row">${infoStr}</div>
            ${r.current_position ? `<div class="info-row">${r.current_position}</div>` : ''}
            ${r.current_salary || r.expected_salary ? `<div class="info-row">💰 ${[r.current_salary, r.expected_salary].filter(Boolean).join(' → ')}</div>` : ''}
          </div>
        </div>
        ${r.photo ? `<div style="flex-shrink:0;"><img src="${r.photo}" style="width:56px;height:56px;border-radius:50%;object-fit:cover;border:2px solid var(--border-light);"></div>` : ''}
      </div>
      <div class="card-tags">${tags.join('')}</div>
      <div class="card-footer">
        <span class="status-badge ${(r.interview_status||'screening')}">${statusLabel(r.interview_status)}</span>
        <span class="time">${timeAgo(r.updated_at || r.created_at)}</span>
      </div>
    </div>`;
  }).join('');
}

async function readFile(file) {
  currentFile = file;
  currentPDFImage = null;
  const zone = document.getElementById('uploadZone');
  zone.innerHTML = `<div class="upload-icon">📖</div><p>正在读取 ${file.name}…</p>`;

  let text = '';
  if (file.type === 'text/plain' || file.name.endsWith('.txt')) {
    text = await file.text();
  } else if (file.type === 'application/pdf' || file.name.endsWith('.pdf')) {
    text = await readPDF(file);
    // Also render first page as image
    try { currentPDFImage = await renderPDFPage(file, 1); } catch(e) { /* ignore */ }
  } else if (file.type.includes('word') || file.name.endsWith('.doc') || file.name.endsWith('.docx')) {
    text = await readDocx(file);
  } else {
    text = await file.text();
  }

  if (!text || text.trim().length < 10) {
    zone.innerHTML = `<div class="upload-icon">⚠️</div><p>无法读取文件内容</p><p class="hint">请尝试粘贴文本</p>`;
    return;
  }

    </div>
  `;
  toast('文件读取成功' + (currentPDFImage ? '，已提取简历图片' : ''), 'success');
}

async function renderPDFPage(file, pageNum) {
  const arrayBuffer = await file.arrayBuffer();
  const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
  const page = await pdf.getPage(pageNum);
  const viewport = page.getViewport({ scale: 1.5 });
  const canvas = document.createElement('canvas');
  canvas.width = viewport.width;
  canvas.height = viewport.height;
  const ctx = canvas.getContext('2d');
  await page.render({ canvasContext: ctx, viewport }).promise;
  return canvas.toDataURL('image/jpeg', 0.85);
}

async function readPDF(file) {
  try {
    const arrayBuffer = await file.arrayBuffer();
    const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
    let text = '';
    for (let i = 1; i <= pdf.numPages; i++) {
      const page = await pdf.getPage(i);
      const content = await page.getTextContent();
      text += content.items.map(item => item.str).join(' ') + '\n';
    }
    return text;
  } catch (e) {
    console.error('PDF parse error:', e);
    return '';
  }
}

async function readDocx(file) {
  try {
    const arrayBuffer = await file.arrayBuffer();
    const result = await mammoth.extractRawText({ arrayBuffer });
    return result.value;
  } catch (e) {
    console.error('DOCX parse error:', e);
    return '';
  }
}

async function extractResume() {

  try {
    const prompt = `你是一个专业的简历解析助手。请从以下简历文本中提取信息，返回严格的JSON格式（不要markdown代码块）。

简历文本：
${text.substring(0, 8000)}

请提取以下字段，简历中没有提到的字段设为 null：
{

  "degree": "学历（博士/硕士/本科/大专）",
  "major": "专业全称",
  "graduation_year": "毕业年份",
  "current_company": "当前或最近的公司全称",
  "current_position": "当前或最近的职位",
  "work_years": "工作年限（仅数字）",
  "employment_status": "在职状态（在职/离职）",
  "current_salary": "当前薪资（含单位，如30K*16）",

  "target_position": "应聘岗位"
}

只返回JSON，不要任何其他文字。`;

    const response = await fetch(DEEPSEEK_API_URL, {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'Authorization': `Bearer ${DEEPSEEK_API_KEY}`,
      },
      body: JSON.stringify({
        model: 'deepseek-chat',
        messages: [{ role: 'user', content: prompt }],
        temperature: 0.1,
        max_tokens: 2000,
      }),
    });

    const data = await response.json();
    if (!response.ok) throw new Error(data.error?.message || 'API 调用失败');

    let content = data.choices?.[0]?.message?.content || '';
    // Try to extract JSON from response (in case of markdown wrapping)

function calculateAge(data) {
  // Calculate age from birth_date or birth_year
  if (data.age && !isNaN(parseInt(data.age))) return String(parseInt(data.age));

  const today = new Date();
  let birthDate = null;

  if (data.birth_date) {
    const parts = data.birth_date.split('-');
    if (parts.length >= 2) {
      const year = parseInt(parts[0]);
      const month = parseInt(parts[1]) - 1;
      const day = parts[2] ? parseInt(parts[2]) : 1;
      birthDate = new Date(year, month, day);
    }
  } else if (data.birth_year) {
    const year = parseInt(data.birth_year);
    birthDate = new Date(year, 6, 1); // July 1st as midpoint
  }

  if (birthDate && !isNaN(birthDate.getTime())) {
    let age = today.getFullYear() - birthDate.getFullYear();
    const m = today.getMonth() - birthDate.getMonth();
    if (m < 0 || (m === 0 && today.getDate() < birthDate.getDate())) age--;
    return String(age);
  }

  return data.age || null;
}

function exportJSON() {
  if (resumes.length === 0) return toast('没有可导出的数据', 'info');
  const blob = new Blob([JSON.stringify(resumes, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `简历备份_${new Date().toISOString().slice(0,10)}.json`;
  a.click();
  URL.revokeObjectURL(url);
  toast(`已导出 ${resumes.length} 份简历 ✅`, 'success');
}

function importJSON() {
  const input = document.createElement('input');
  input.type = 'file';
  input.accept = '.json';
  input.onchange = async e => {
    const file = e.target.files[0];
    if (!file) return;
    try {
      const text = await file.text();
      const data = JSON.parse(text);
      if (!Array.isArray(data)) throw new Error('格式错误：需要 JSON 数组');
      const merged = mergeResumes(resumes, data);
      resumes = merged;
      saveLocal(resumes);
      renderAll();
      toast(`已导入 ${data.length} 份简历 ✅`, 'success');
    } catch (err) {
      toast('导入失败: ' + err.message, 'error');
    }
  };
  input.click();
}

async function syncNow() {
  if (!supabaseOnline) {
    // Try to reconnect first
    const online = await checkSupabase();
    if (!online) return toast('Supabase 不可用，请先恢复项目', 'error');
  }
  try {
    // Push local to remote
    await pushAllToSupabase(resumes);
    // Pull remote and merge
    const remote = await loadSupabase();
    resumes = mergeResumes(resumes, remote);
    saveLocal(resumes);
    localStorage.setItem(SYNC_KEY, Date.now());
    updateSyncIndicator();
    renderAll();
    toast(`同步完成，共 ${resumes.length} 份简历 ✅`, 'success');
  } catch (e) {
    toast('同步失败: ' + e.message, 'error');
  }
}

// Quick CSV export (also available from exportJSON button)
function exportCSV() {
  if (resumes.length === 0) return toast('没有可导出的数据', 'info');
  const headers = ['编号','姓名','性别','年龄','手机','邮箱','城市','学校','学历','专业','毕业年份','公司','职位','工作年限','在职状态','当前薪资','期望薪资','技术方向','GitHub','论文','顶会','来源','应聘岗位','面试状态','HR备注'];
  const keys = ['unique_code','name','gender','age','phone','email','city','school','degree','major','graduation_year','current_company','current_position','work_years','employment_status','current_salary','expected_salary','tech_direction','github','papers_link','has_top_papers','source','target_position','interview_status','hr_notes'];
  const rows = resumes.map(r => keys.map(k => {
    const v = r[k];
    if (typeof v === 'boolean') return v ? '是' : '否';
    if (Array.isArray(v)) return v.join('|');
    return v ?? '';
  }).map(c => `"${String(c).replace(/"/g,'""')}"`).join(','));
  const csv = '﻿' + [headers.join(','), ...rows].join('\n');
  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = `简历导出_${new Date().toISOString().slice(0,10)}.csv`;
  a.click();
  URL.revokeObjectURL(url);
  toast('CSV 导出成功 ✅', 'success');
}

// ========== DETAIL VIEW ==========
function openDetail(id) {
  const r = resumes.find(r => r.id == id);
  if (!r) return;

  document.getElementById('detailTitle').textContent = '简历详情';
  document.getElementById('detailOverlay').classList.add('open');
  document.getElementById('detailSheet').classList.add('open');

  const statusClass = (r.interview_status || 'screening');
  const infoRow = (key, val) => {
    if (!val) return '';
    return '<div class="detail-info-row"><span class="info-key">' + key + '</span><span class="info-val">' + val + '</span></div>';
  };

  const sectionCard = (icon, title, rows) => {
    if (!rows.trim()) return '';
    return '<div class="detail-section-card"><div class="section-title"><span class="section-icon">' + icon + '</span>' + title + '</div>' + rows + '</div>';
  };

  // Basic info
  const codeHtml = '<code style="font-size:12px;background:var(--card);padding:2px 8px;border-radius:4px;">' + (r.unique_code || '') + '</code>';
  const basicRows = [
    infoRow('编号', codeHtml),
    infoRow('性别', r.gender || ''),
    infoRow('年龄', r.age ? r.age + '岁' : ''),
    infoRow('手机', r.phone ? '<a href="tel:' + r.phone + '">' + r.phone + '</a>' : ''),
    infoRow('邮箱', r.email ? '<a href="mailto:' + r.email + '">' + r.email + '</a>' : ''),
    infoRow('城市', r.city || ''),
  ].filter(Boolean).join('');

  // Education
  const eduRows = [
    infoRow('学校', r.school ? '<strong>' + r.school + '</strong>' : ''),
    infoRow('学历', r.degree || ''),
    infoRow('专业', r.major || ''),
    infoRow('毕业', r.graduation_year || ''),
  ].filter(Boolean).join('');

  // Work
  const workRows = [
    infoRow('公司', r.current_company ? '<strong>' + r.current_company + '</strong>' : ''),
    infoRow('职位', r.current_position || ''),
    infoRow('年限', r.work_years ? r.work_years + '年' : ''),
    infoRow('状态', r.employment_status || ''),
  ].filter(Boolean).join('');

  // Salary
  const salaryRows = [
    infoRow('当前', r.current_salary ? '💰 ' + r.current_salary : ''),
    infoRow('期望', r.expected_salary ? '🎯 ' + r.expected_salary : ''),
  ].filter(Boolean).join('');

  // Tech & Skills
  let techRows = [
    infoRow('方向', r.tech_direction ? '<span class="tag purple">' + r.tech_direction + '</span>' : ''),
    infoRow('GitHub', r.github ? '<a href="' + r.github + '" target="_blank">' + r.github + '</a>' : ''),
    infoRow('顶会', r.has_top_papers ? '✅ 有顶会论文' : ''),
    infoRow('论文', r.papers_link ? '<a href="' + r.papers_link + '" target="_blank">' + r.papers_link + '</a>' : ''),
  ].filter(Boolean).join('');
  if (r.skills && r.skills.length) {
    techRows += '<div class="detail-tags-row">' + r.skills.map(function(s) { return '<span class="tag">' + s + '</span>'; }).join('') + '</div>';
  }

  // Recruitment info
  const recruitRows = [
    infoRow('岗位', r.target_position ? '<strong>' + r.target_position + '</strong>' : ''),
    infoRow('来源', r.source || ''),
    infoRow('面试状态', '<span class="status-badge ' + statusClass + '">' + statusLabel(r.interview_status) + '</span>'),
  ].filter(Boolean).join('');

  // Notes
  const notesBlock = r.hr_notes ? '<div class="detail-text-block">' + escapeHtml(r.hr_notes) + '</div>' : '';

  // Resume text block
  let resumeTextBlock = '';
  if (r.resume_text) {
    resumeTextBlock = '<div class="detail-section"><h4>📄 原始简历文本</h4><div class="detail-text-block">' + escapeHtml(r.resume_text.substring(0, 1500)) + (r.resume_text.length > 1500 ? '…' : '') + '</div></div>';
  }

  // Photo HTML
  var photoHtml = r.photo ? '<img src="' + r.photo + '" alt="photo">' : '👤';

  document.getElementById('detailBody').innerHTML =
    '<!-- HERO -->' +
    '<div class="detail-hero">' +
      '<div class="detail-hero-photo">' + photoHtml + '</div>' +
      '<div class="detail-hero-info">' +
        '<div class="hero-name">' + (r.name || '未命名') + '</div>' +
        '<div class="hero-code">' + (r.unique_code || '') + '</div>' +
        '<div class="hero-meta">' +
          '<span class="status-badge ' + statusClass + '" style="font-size:13px;padding:5px 14px;">' + statusLabel(r.interview_status) + '</span>' +
          (r.degree ? '<span class="tag teal">' + r.degree + '</span>' : '') +
          (r.tech_direction ? '<span class="tag purple">' + r.tech_direction + '</span>' : '') +
          (r.has_top_papers ? '<span class="tag orange">🏆 顶会</span>' : '') +
        '</div>' +
      '</div>' +
    '</div>' +

    sectionCard('👤', '基本信息', basicRows) +
    sectionCard('🎓', '教育背景', eduRows) +
    sectionCard('💼', '工作经历', workRows) +
    (salaryRows ? sectionCard('💵', '薪资情况', salaryRows) : '') +
    sectionCard('🧠', '技术 & 技能', techRows) +

    (r.hr_notes ? sectionCard('📝', 'HR 备注', notesBlock) : '') +

    '<div class="detail-section-card">' +
      '<div class="section-title"><span class="section-icon">🔄</span>更新面试状态</div>' +
      '<select style="width:100%;height:42px;border-radius:10px;border:1px solid var(--border);padding:0 14px;font-size:15px;font-family:var(--font);background:var(--card);cursor:pointer;" onchange="updateStatus(' + r.id + ', this.value)">' +

        '<option value="rejected"' + (r.interview_status === 'rejected' ? ' selected' : '') + '>❌ 已拒绝</option>' +
      '</select>' +
    '</div>' +

    '<!-- FOOTER -->' +
    '<div class="action-bar">' +
      '<button class="btn btn-danger btn-sm" onclick="confirmDelete(' + r.id + ')">🗑 删除此简历</button>' +
      '<div style="flex:1;"></div>' +
      '<span style="font-size:11px;color:var(--text-tertiary);text-align:right;line-height:1.6;">' +
        '创建于 ' + new Date(r.created_at).toLocaleString('zh-CN') + '<br>' +
        '最后更新 ' + new Date(r.updated_at).toLocaleString('zh-CN') +

    '</div>';
}

function closeDetail(e) {
  if (e && e.target !== document.getElementById('detailOverlay')) return;
  document.getElementById('detailOverlay').classList.remove('open');
  document.getElementById('detailSheet').classList.remove('open');
}

// ========== KEYBOARD SHORTCUTS ==========
document.addEventListener('keydown', e => {
  if (e.key === 'Escape') {
    closeSheet();
    closeDetail();
    closeConfirm();
  }
  if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
    e.preventDefault();
    document.getElementById('searchInput').focus();
  }
});

// ========== CLICK OUTSIDE TO CLOSE ==========
document.getElementById('sheetOverlay').addEventListener('click', closeSheet);
document.getElementById('detailOverlay').addEventListener('click', closeDetail);

// ========== INIT ==========
function setupRealtime() {
  if (!supabaseOnline) return;
  sb.channel('resumes-changes')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'resumes' },
      (payload) => {
        console.log('Realtime change:', payload.eventType, payload.new?.unique_code);
        const newData = payload.new;
        const oldData = payload.old;

        if (payload.eventType === 'INSERT') {
          // New resume added from another device
          const exists = resumes.find(r => r.unique_code === newData.unique_code);
          if (!exists) {
            resumes.unshift({ ...newData, id: newData.id?.toString() || Date.now().toString() });
            saveLocal(resumes);
            renderAll();
            toast(`📥 收到新简历: ${newData.name || '未命名'}`, 'info');
          }
        } else if (payload.eventType === 'UPDATE') {
          const idx = resumes.findIndex(r => r.unique_code === newData.unique_code || r.id == newData.id);
          if (idx > -1) {
            resumes[idx] = { ...resumes[idx], ...newData, id: resumes[idx].id };
            saveLocal(resumes);
            renderAll();
          }
        } else if (payload.eventType === 'DELETE') {
          const idx = resumes.findIndex(r => r.unique_code === oldData?.unique_code || r.id == oldData?.id);
          if (idx > -1) {
            const name = resumes[idx].name;
            resumes.splice(idx, 1);
            saveLocal(resumes);
            renderAll();
            toast(`🗑 简历已删除: ${name || '未命名'}`, 'info');
          }
        }
      }
    )
    .subscribe((status) => {
      console.log('Realtime subscription:', status);
    });
}

async function init() {
  document.getElementById('loadingSkeleton').style.display = 'none';

  // Always load local first — instant
  resumes = loadLocal();
  renderAll();
  updateSyncIndicator();

  // Try Supabase in background
  checkSupabase().then(online => {
    if (online) {
      updateSyncIndicator();
      setupRealtime();
      // Try to sync silently
      loadSupabase().then(remote => {
        if (remote.length > 0) {
          resumes = mergeResumes(resumes, remote);
          saveLocal(resumes);
          localStorage.setItem(SYNC_KEY, Date.now());
          updateSyncIndicator();
          renderAll();
        } else if (resumes.length > 0) {
          pushAllToSupabase(resumes);
        }
      }).catch(() => {});
    }
  });
}
