<!-- ══════════════════════ AI 评估 V2 ══════════════════════ -->

<div class="card" data-reveal>
  <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
    <span>🎯 选择岗位</span>
    <a href="/jobs" style="font-size:var(--text-sm);color:var(--accent);text-decoration:none;font-weight:450;">+ 管理岗位</a>
  </div>
  <select id="job-selector" onchange="loadJob(this.value)">
    <option value="">-- 选择已保存的岗位（自动填充 JD）--</option>
  </select>
</div>

<div class="card" data-reveal>
  <div class="card-header">📥 输入简历</div>

  <!-- Tab 切换 -->
  <div class="tabs" id="input-tabs">
    <button class="tab-btn active" onclick="switchTab('pdf')">📄 PDF 上传</button>
    <button class="tab-btn" onclick="switchTab('text')">📝 粘贴文字</button>
    <button class="tab-btn" onclick="switchTab('image')">📸 图片识别</button>
  </div>

  <!-- PDF 上传 -->
  <div class="tab-panel active" id="tab-pdf">
    <div class="upload-zone" id="drop-zone" onclick="document.getElementById('file-input').click()">
      <div style="font-size:2.2rem;margin-bottom:4px;">📤</div>
      <p style="font-weight:500;">点击上传或拖拽 PDF 到这里</p>
      <p id="file-name" style="color:var(--accent);font-weight:500;"></p>
    </div>
    <input type="file" id="file-input" accept=".pdf" style="display:none;" onchange="handlePDF(this.files[0])">
  </div>

  <!-- 粘贴文字 -->
  <div class="tab-panel" id="tab-text">
    <textarea id="paste-textarea" placeholder="直接粘贴简历文字到这里..." style="height:180px;"></textarea>
    <button class="btn btn-primary btn-sm" onclick="usePastedText()" style="margin-top:var(--space-3);">✅ 确认使用</button>
  </div>

  <!-- 图片识别 -->
  <div class="tab-panel" id="tab-image">
    <div class="upload-zone" id="img-zone" onclick="document.getElementById('img-input').click()">
      <div style="font-size:2.2rem;margin-bottom:4px;">🖼️</div>
      <p style="font-weight:500;">点击上传简历截图或照片</p>
      <p style="font-size:var(--text-xs);">支持 PNG / JPG / WEBP</p>
    </div>
    <input type="file" id="img-input" accept="image/*" style="display:none;" onchange="handleImage(this.files[0])">
    <div id="ocr-status" style="margin-top:var(--space-2);"></div>
  </div>

  <!-- 共享预览 -->
  <div id="resume-preview" style="margin-top:var(--space-4);display:none;">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-2);">
      <span style="font-weight:600;font-size:var(--text-sm);">提取文本预览</span>
      <span id="text-length" style="color:var(--text-secondary);font-size:var(--text-xs);"></span>
    </div>
    <textarea id="resume-text" readonly
      style="height:120px;background:var(--bg-elevated);font-size:var(--text-sm);"
      placeholder="提取的文本将显示在这里..."></textarea>
  </div>
</div>

<div class="card" data-reveal>
  <div class="card-header">岗位描述（JD）</div>
  <textarea id="jd-text" placeholder="粘贴岗位 JD 或从上方选择已保存的岗位..." style="height:100px;"></textarea>
</div>

<!-- 候选人信息：自动从简历提取，默认折叠 -->
<div id="candidate-info-card" style="display:none;">
  <div class="card" data-reveal style="margin-bottom:var(--space-2);padding:var(--space-4);background:var(--bg-elevated);">
    <div style="display:flex;align-items:center;justify-content:space-between;cursor:pointer;" onclick="document.getElementById('cand-fields').style.display = document.getElementById('cand-fields').style.display === 'none' ? 'grid' : 'none'">
      <span style="font-weight:550;font-size:var(--text-sm);" id="cand-summary">已识别候选人信息</span>
      <span style="font-size:var(--text-xs);color:var(--text-tertiary);">点击展开修改</span>
    </div>
    <div id="cand-fields" style="display:none;display:grid;grid-template-columns:1fr 1fr;gap:var(--space-2);margin-top:var(--space-3);">
      <input type="text" id="cand-name" placeholder="姓名">
      <input type="text" id="cand-email" placeholder="邮箱">
      <input type="text" id="cand-phone" placeholder="电话">
      <input type="text" id="cand-job" placeholder="应聘岗位">
    </div>
  </div>
</div>

<button class="btn btn-primary" onclick="startScoring()"
  style="width:100%;padding:14px;font-size:var(--text-base);font-weight:550;margin-bottom:var(--space-5);">
  开始 AI 评估
</button>

<div id="score-panel"></div>

<div class="card" id="followup-card" style="display:none;" data-reveal>
  <div class="card-header">💬 追问候选人细节</div>
  <p style="font-size:var(--text-xs);color:var(--text-tertiary);margin-bottom:var(--space-3);">
    试试："技术短板在哪？" "跳槽频率合理吗？" "面试重点问什么？" "能带团队吗？"
  </p>
  <div id="chat-messages" style="max-height:280px;overflow-y:auto;margin-bottom:var(--space-3);"></div>
  <div style="display:flex;gap:var(--space-2);">
    <input type="text" id="chat-input" placeholder="输入追问..."
      style="flex:1;"
      onkeydown="if(event.key==='Enter')sendFollowup()">
    <button class="btn btn-primary btn-sm" onclick="sendFollowup()">发送</button>
  </div>
  <div id="chat-loading" style="display:none;text-align:center;color:var(--text-tertiary);padding:var(--space-2);font-size:var(--text-sm);">
    🤔 AI 分析中...
  </div>
</div>

<!-- 样式+JS 已移至 base_v2.html 全局，HTMX 导航也能执行 -->
