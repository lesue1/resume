<!-- ══════════════════════ 岗位管理 V2 ══════════════════════ -->

<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-5);">
  <h2 style="font-size:var(--text-3xl);font-weight:650;letter-spacing:var(--tracking-tight);">📌 岗位管理</h2>
  <button class="btn btn-primary" onclick="openJobForm()">+ 新建岗位</button>
</div>

<!-- 弹窗 -->
<div id="job-form-modal" style="display:none;position:fixed;top:0;left:0;width:100%;height:100%;background:rgba(0,0,0,0.25);z-index:200;justify-content:center;align-items:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);">
  <div class="card" style="width:100%;max-width:560px;max-height:88vh;overflow-y:auto;animation:scaleIn 0.2s ease;">
    <div class="card-header" style="display:flex;justify-content:space-between;align-items:center;">
      <span id="form-title" style="font-size:var(--text-lg);">新建岗位</span>
      <button onclick="closeJobForm()" class="btn btn-ghost btn-sm">✕</button>
    </div>
    <input type="hidden" id="job-id">
    <div style="margin-bottom:var(--space-3);">
      <label style="font-weight:500;font-size:var(--text-sm);display:block;margin-bottom:4px;">岗位名称 *</label>
      <input type="text" id="job-title" placeholder="如：Python 后端开发工程师">
    </div>
    <div style="margin-bottom:var(--space-3);">
      <label style="font-weight:500;font-size:var(--text-sm);display:block;margin-bottom:4px;">岗位 JD</label>
      <textarea id="job-jd" rows="6" placeholder="岗位职责和工作内容：&#10;• 负责...&#10;• 参与..."></textarea>
    </div>
    <div style="margin-bottom:var(--space-3);">
      <label style="font-weight:500;font-size:var(--text-sm);display:block;margin-bottom:4px;">附加要求</label>
      <textarea id="job-reqs" rows="4" placeholder="学历/经验/技能等硬性要求：&#10;• 本科及以上，计算机相关专业&#10;• 3年以上 Python 开发经验"></textarea>
    </div>
    <div style="display:flex;gap:var(--space-2);justify-content:flex-end;">
      <button class="btn btn-secondary" onclick="closeJobForm()">取消</button>
      <button class="btn btn-primary" onclick="submitJob()">保存</button>
    </div>
  </div>
</div>

<!-- 岗位列表 -->
<div id="job-list" hx-get="/api/jobs/list" hx-trigger="load" hx-swap="innerHTML">
  <p class="loading">加载中...</p>
</div>

<style>
  .job-card {
    background: var(--bg); border-radius: var(--radius-md);
    padding: var(--space-5) var(--space-6); margin-bottom: var(--space-3);
    border: 0.5px solid var(--border);
    box-shadow: var(--shadow-sm);
    transition: all 0.2s ease;
  }
  .job-card:hover {
    box-shadow: var(--shadow-md);
    border-color: var(--border-hover);
    transform: translateY(-1px);
  }
</style>

<script>
function openJobForm(jobId) {
  document.getElementById('job-form-modal').style.display = 'flex';
  if (!jobId) {
    document.getElementById('form-title').textContent = '新建岗位';
    document.getElementById('job-id').value = '';
    document.getElementById('job-title').value = '';
    document.getElementById('job-jd').value = '';
    document.getElementById('job-reqs').value = '';
    return;
  }
  document.getElementById('form-title').textContent = '编辑岗位';
  fetch('/api/jobs/' + jobId)
    .then(r => r.json())
    .then(j => {
      document.getElementById('job-id').value = j.id;
      document.getElementById('job-title').value = j.title || '';
      document.getElementById('job-jd').value = j.jd_text || '';
      document.getElementById('job-reqs').value = j.requirements || '';
    });
}

function closeJobForm() { document.getElementById('job-form-modal').style.display = 'none'; }
function editJob(id) { openJobForm(id); }

function submitJob() {
  const title = document.getElementById('job-title').value.trim();
  if (!title) { alert('岗位名称不能为空'); return; }
  fetch('/api/jobs/save', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({
      title: title,
      jd_text: document.getElementById('job-jd').value,
      requirements: document.getElementById('job-reqs').value,
      department: '',
    })
  })
  .then(r => r.json())
  .then(data => {
    if (data.success) {
      closeJobForm();
      htmx.trigger('#job-list', 'refresh-jobs');
    } else {
      alert('保存失败: ' + data.error);
    }
  });
}

function confirmDeleteJob(id) {
  if (!confirm('确认删除这个岗位？')) return;
  fetch('/api/jobs/' + id + '/delete', { method: 'POST' })
    .then(r => r.json())
    .then(data => {
      if (data.success) htmx.trigger('#job-list', 'refresh-jobs');
    });
}

document.body.addEventListener('refresh-jobs', function() {
  htmx.ajax('GET', '/api/jobs/list', { target: '#job-list' });
});
</script>
